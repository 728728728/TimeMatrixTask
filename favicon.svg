<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="matrix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 背景サークル -->
  <circle cx="50" cy="50" r="46" fill="url(#matrix-grad)" stroke="#ffffff" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- 4象限マトリックス -->
  <rect x="22" y="22" width="26" height="26" rx="5" fill="#f43f5e" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <rect x="52" y="22" width="26" height="26" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="22" y="52" width="26" height="26" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="52" y="52" width="26" height="26" rx="5" fill="#e9d5ff" opacity="0.8"/>
  
  <!-- 第一象限（重要＆緊急）の稲妻／ターゲットアクセント -->
  <path d="M36 27 l-4 9 h6 l-2 9 l8 -11 h-6 l4 -7 z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
</svg>
